name: mainnet-core-candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - contracts/payments-mainnet/**
      - packages/shared/**
      - packages/near-client/**
      - .github/workflows/mainnet-core-candidate.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Unit tests and Clippy (not sandbox or release approval)
        working-directory: contracts/payments-mainnet
        run: |
          cargo test --locked --lib -- --test-threads=1
          cargo clippy --locked --lib -- -D warnings
      - name: Build candidate WASM
        working-directory: contracts/payments-mainnet
        run: bash scripts/build.sh
      - name: Frozen existing source
        run: node contracts/payments/scripts/check-isolation.mjs
      - name: Deployment planner tests
        run: node --test contracts/payments-mainnet/scripts/deploy-dry-run.test.mjs
      - name: Explicit release gate
        run: |
          echo 'NO-GO: this workflow does not prove router gas bounds, sandbox balances, R-2 safety or live mainnet settlement.' >> "$GITHUB_STEP_SUMMARY"
