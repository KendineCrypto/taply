name: mainnet-core-candidate
on:
  push:
    branches: [codex/mainnet-core]
  workflow_dispatch:
  pull_request:
    paths:
      - contracts/payments-mainnet/**
      - packages/shared/**
      - packages/near-client/**
      - .github/workflows/mainnet-core-candidate.yml
permissions:
  contents: read
concurrency:
  group: mainnet-core-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            contracts/payments-mainnet/target
            contracts/payments-mainnet/sandbox/target
            contracts/test-token/target
          key: mainnet-${{ runner.os }}-rust1.95.0-${{ hashFiles('contracts/payments-mainnet/Cargo.lock', 'contracts/payments-mainnet/sandbox/Cargo.lock') }}
      - name: Produce formatting patch for Windows authoring host
        run: |
          mkdir -p contracts/payments-mainnet/artifacts
          (cd contracts/payments-mainnet && cargo fmt --all)
          (cd contracts/payments-mainnet/sandbox && cargo fmt --all)
          git diff -- contracts/payments-mainnet > contracts/payments-mainnet/artifacts/rustfmt.patch
      - name: Unit tests and Clippy (not sandbox or release approval)
        working-directory: contracts/payments-mainnet
        run: |
          cargo test --locked --lib -- --test-threads=1
          cargo clippy --locked --lib -- -D warnings
      - name: Build candidate WASM
        working-directory: contracts/payments-mainnet
        run: bash scripts/build.sh
      - name: Measure production candidate artifact
        run: node contracts/payments-mainnet/scripts/measure-wasm.mjs
      - name: Real NEAR sandbox and adversarial router tests
        working-directory: contracts/payments-mainnet
        run: bash scripts/sandbox.sh
      - name: Frozen existing source
        run: node contracts/payments/scripts/check-isolation.mjs
      - name: Deployment planner tests
        run: node --test contracts/payments-mainnet/scripts/deploy-dry-run.test.mjs
      - name: Explicit release gate
        run: |
          echo 'NO-GO for live funds: local sandbox evidence is not live USDC/router or Base-origin integration proof. R-2 remains open.' >> "$GITHUB_STEP_SUMMARY"
          cat contracts/payments-mainnet/artifacts/build-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate and local verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mainnet-core-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            contracts/payments-mainnet/artifacts/payments-mainnet.wasm
            contracts/payments-mainnet/artifacts/build-report.json
            contracts/payments-mainnet/artifacts/rustfmt.patch
            contracts/payments-mainnet/artifacts/wasm.sha256
            contracts/payments-mainnet/artifacts/*.log
            contracts/payments-mainnet/artifacts/mainnet-sandbox/*.json
