# Taply Protected Pay (G3) CANDIDATE contract checks. Unit tests, clippy, WASM
# build and cross-language wire check only. No network deployment, no wallet
# keys, no repository secrets. This workflow does not approve the candidate.
name: protected-pay-candidate

on:
  workflow_dispatch:
  push:
    paths:
      - contracts/payments-protected/**
      - contracts/test-token/**
      - packages/shared/**
      - .github/workflows/protected-pay-candidate.yml
  pull_request:
    paths:
      - contracts/payments-protected/**
      - packages/shared/**
      - .github/workflows/protected-pay-candidate.yml

permissions:
  contents: read

concurrency:
  group: protected-pay-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: fmt, unit tests, clippy, WASM, sandbox, wire schema
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: contracts/payments-protected
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24.22.2 (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          cargo -V
      - name: Frozen G1 contract inputs unchanged
        working-directory: .
        run: node contracts/payments/scripts/check-isolation.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Unit tests
        run: cargo test --locked --lib -- --test-threads=1 --color never
      - name: Test token format and clippy
        working-directory: contracts/test-token
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: WASM build (candidate, not approved)
        run: bash scripts/build.sh
      - name: Sandbox format and clippy
        working-directory: contracts/payments-protected/sandbox
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      # Real local NEAR node: actual refund and release transfers, gas measured.
      - name: Sandbox suite (3 protected + 4 NEP-141 tests, sequential)
        run: |
          bash scripts/sandbox.sh
          grep -q "test result: ok. 3 passed; 0 failed" artifacts/sandbox-tests.log
          grep -q "test result: ok. 4 passed; 0 failed" artifacts/sandbox-tests.log
          grep -a MEASURE artifacts/sandbox-tests.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Build @taply/shared
        working-directory: .
        run: |
          npm install -g pnpm@11.5.0
          pnpm install --frozen-lockfile
          pnpm --filter @taply/shared run build
      - name: Wire-schema check (unit-test and sandbox records)
        working-directory: .
        run: |
          node contracts/payments-protected/scripts/check-wire.mjs
          node contracts/payments-protected/scripts/check-wire.mjs sandbox
          node contracts/payments-protected/scripts/check-wire.mjs token
          node contracts/payments-protected/scripts/check-wire.mjs sandbox-token
