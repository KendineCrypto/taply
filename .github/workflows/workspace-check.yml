# Taply TypeScript workspace gate: frozen lockfile install + root `pnpm check`
# (brand assets, build, typecheck, lint, tests for shared, near-client and web),
# followed by the standalone gated API and production Webpack build.
# No deployment, no wallet keys, no repository secrets, no network calls to NEAR.
name: workspace-check

on:
  workflow_dispatch:
  push:
    branches: [feature/frontend, feature/phase7-integration, main]
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - README.md
      - docs/**
      - .github/workflows/workspace-check.yml
  pull_request:
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - README.md
      - docs/**
      - .github/workflows/workspace-check.yml

permissions:
  contents: read

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frozen install + pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24.22.2 (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm 11.5.0
        run: |
          npm install -g pnpm@11.5.0
          node -v; pnpm -v

      # Live Handshake (web) and the API store have tests against a REAL redis-server;
      # without it they are skipped. Installing it makes those 8 tests run here.
      - name: Install redis-server (for the real-Redis tests)
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          redis-server --version

      - name: Install (frozen lockfile, whole workspace)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        timeout-minutes: 15
        run: pnpm check

      - name: Standalone API strict types, lint and offline integration tests
        run: |
          node packages/shared/node_modules/typescript/bin/tsc -p apps/api/tsconfig.json
          node apps/web/node_modules/eslint/bin/eslint.js --config apps/api/eslint.config.mjs apps/api/src apps/api/test
          node --test apps/api/test/*.test.mts

      - name: Production Webpack build
        run: pnpm --filter @taply/web exec next build --webpack

      # NEAR mainnet candidate (docs/MAINNET_1CLICK_INTEGRATION.md §8). Preview
      # shape: no contract pinned, fixture screens, no signing, no funded quotes.
      # The guard must pass here and must refuse a build that inherits Testnet
      # values from the committed .env.production.
      - name: Mainnet build guard refuses inherited Testnet values
        working-directory: apps/web
        run: |
          if NEXT_PUBLIC_TAPLY_NETWORK=near-mainnet VERCEL_ENV=production node scripts/check-mainnet-env.mjs --require-mainnet; then
            echo "check-mainnet-env did not refuse a Testnet-valued mainnet build"; exit 1
          fi

      - name: Mainnet preview build (guarded) and static leak check
        working-directory: apps/web
        run: |
          set -a; . ./env/mainnet.env.example; set +a
          export VERCEL_ENV=preview NEXT_PUBLIC_TAPLY_SHARE_ORIGIN= NEXT_PUBLIC_TAPLY_CONTRACT_ID= NEXT_PUBLIC_TAPLY_PROTECTED_CONTRACT_ID= NEXT_PUBLIC_TAPLY_MAINNET_FIXTURES=on
          pnpm run build:mainnet
          if grep -rl -e 'taply-e2e-ce38a238' -e 'taply.testnet-vault.v1' .next/static; then
            echo "Testnet contract or vault key found in the mainnet bundle"; exit 1
          fi
          if grep -rl 'taply.mainnet.sim-authority' .next/static; then
            echo "Simulated wallet authority (test harness) found in a non-simulation mainnet bundle"; exit 1
          fi

      - name: Mainnet 88 browser checks (local fixtures only)
        working-directory: apps/web
        timeout-minutes: 8
        run: |
          npm install --prefix "$RUNNER_TEMP/taply-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/taply-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          set -a; . ./env/mainnet.env.example; set +a
          export VERCEL_ENV=preview NEXT_PUBLIC_TAPLY_SHARE_ORIGIN= NEXT_PUBLIC_TAPLY_CONTRACT_ID= NEXT_PUBLIC_TAPLY_PROTECTED_CONTRACT_ID= NEXT_PUBLIC_TAPLY_MAINNET_FIXTURES=on TAPLY_ONECLICK_MODE=fixture
          pnpm exec next start -p 3113 --hostname 127.0.0.1 > "$RUNNER_TEMP/taply-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3113/m > /dev/null; then break; fi
            sleep 1
          done
          node scripts/mainnet-1click-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence" http://127.0.0.1:3113
          node scripts/mainnet-product-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/product" http://127.0.0.1:3113
          node ../../packages/near-client/test/mainnet-indexeddb-browser.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/indexeddb"

      # Phase 2 parity (docs/MAINNET_PARITY_MATRIX.md): Mainnet Live Handshake on a
      # REAL redis-server (via the repo's Upstash REST shim) across two browser
      # contexts, Solana/Tron origins, receipt, split prefill, Turkish, leak scan.
      - name: Mainnet phase 2-4 browser checks (Handshake on real Redis, fixtures + synthetic RPC only)
        working-directory: apps/web
        timeout-minutes: 10
        run: |
          set -a; . ./env/mainnet.env.example; set +a
          export VERCEL_ENV=preview NEXT_PUBLIC_TAPLY_SHARE_ORIGIN= NEXT_PUBLIC_TAPLY_CONTRACT_ID= NEXT_PUBLIC_TAPLY_PROTECTED_CONTRACT_ID= NEXT_PUBLIC_TAPLY_MAINNET_FIXTURES=on NEXT_PUBLIC_TAPLY_FLAG_HANDSHAKE=on
          # Phase 4: SYNTHETIC Gift/escrow profiles (fixture accounts, answered only by the in-browser responder).
          export NEXT_PUBLIC_TAPLY_GIFT_CONTRACT_ID=gift.fixture.near NEXT_PUBLIC_TAPLY_GIFT_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf \
            NEXT_PUBLIC_TAPLY_GIFT_MIN_YOCTO=10000000000000000000000 NEXT_PUBLIC_TAPLY_GIFT_MAX_YOCTO=2000000000000000000000000 NEXT_PUBLIC_TAPLY_GIFT_FEE_YOCTO=10000000000000000000000 \
            NEXT_PUBLIC_TAPLY_MAINNET_ESCROW_CONTRACT_ID=payments.fixture.near NEXT_PUBLIC_TAPLY_MAINNET_ESCROW_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf \
            NEXT_PUBLIC_TAPLY_MAINNET_USDC_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf
          KV_REST_API_URL=https://build-placeholder.invalid KV_REST_API_TOKEN=placeholder pnpm run build:mainnet
          redis-server --port 6390 --save '' --appendonly no --daemonize yes
          node scripts/redis-rest-shim.mjs 6390 8079 ci-local-token > "$RUNNER_TEMP/taply-redis-shim.log" 2>&1 &
          shim_pid=$!
          TAPLY_ONECLICK_MODE=fixture KV_REST_API_URL=http://127.0.0.1:8079 KV_REST_API_TOKEN=ci-local-token \
            pnpm exec next start -p 3120 --hostname 127.0.0.1 > "$RUNNER_TEMP/taply-browser-server-phase2.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$shim_pid"; redis-cli -p 6390 shutdown nosave || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3120/m > /dev/null; then break; fi
            sleep 1
          done
          node scripts/mainnet-parity-phase2-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/phase2" http://127.0.0.1:3120
          # Phase 3: wallet create/restore/activation/send review, Protected Pay, Gift (synthetic in-browser RPC).
          node scripts/mainnet-integration-phase3-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/phase3" http://127.0.0.1:3120
          # Phase 4: Send USDC, Personal/Open Gift pages, Protected create+fund, merchant register/checkout, filtered activity.
          node scripts/mainnet-phase4-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/phase4" http://127.0.0.1:3120
          test "$(redis-cli -p 6390 --scan | grep -vc '^taply:mainnet:')" = "0"

      # Phase 5: the app on Codex's unified wallet protocol. SIMULATED single-browser authority store
      # (test harness, refused on Production) handed to Codex's coordinator; synthetic RPC; real Redis for Live.
      - name: Mainnet phase 5 browser checks (simulated authority, synthetic RPC, real Redis)
        working-directory: apps/web
        timeout-minutes: 10
        run: |
          set -a; . ./env/mainnet.env.example; set +a
          export VERCEL_ENV=preview NEXT_PUBLIC_TAPLY_SHARE_ORIGIN= NEXT_PUBLIC_TAPLY_CONTRACT_ID= NEXT_PUBLIC_TAPLY_PROTECTED_CONTRACT_ID= NEXT_PUBLIC_TAPLY_MAINNET_FIXTURES=on NEXT_PUBLIC_TAPLY_FLAG_HANDSHAKE=on
          export NEXT_PUBLIC_TAPLY_GIFT_CONTRACT_ID=gift.fixture.near NEXT_PUBLIC_TAPLY_GIFT_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf \
            NEXT_PUBLIC_TAPLY_GIFT_MIN_YOCTO=10000000000000000000000 NEXT_PUBLIC_TAPLY_GIFT_MAX_YOCTO=2000000000000000000000000 NEXT_PUBLIC_TAPLY_GIFT_FEE_YOCTO=10000000000000000000000 \
            NEXT_PUBLIC_TAPLY_MAINNET_ESCROW_CONTRACT_ID=payments.fixture.near NEXT_PUBLIC_TAPLY_MAINNET_ESCROW_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf \
            NEXT_PUBLIC_TAPLY_MAINNET_USDC_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf NEXT_PUBLIC_TAPLY_MAINNET_AUTHORITY_SIMULATION=on
          KV_REST_API_URL=https://build-placeholder.invalid KV_REST_API_TOKEN=placeholder pnpm run build:mainnet
          redis-server --port 6391 --save '' --appendonly no --daemonize yes
          node scripts/redis-rest-shim.mjs 6391 8078 ci-local-token > "$RUNNER_TEMP/taply-redis-shim-p5.log" 2>&1 &
          shim_pid=$!
          TAPLY_ONECLICK_MODE=fixture KV_REST_API_URL=http://127.0.0.1:8078 KV_REST_API_TOKEN=ci-local-token \
            pnpm exec next start -p 3121 --hostname 127.0.0.1 > "$RUNNER_TEMP/taply-browser-server-phase5.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" "$shim_pid"; redis-cli -p 6391 shutdown nosave || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3121/m > /dev/null; then break; fi
            sleep 1
          done
          node scripts/mainnet-phase5-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/phase5" http://127.0.0.1:3121
          test "$(redis-cli -p 6391 --scan | grep -vc '^taply:mainnet:')" = "0"

      # Phase 6: the app's authority client against Codex's REAL authenticated authority (createMainnetAuthorityHttp +
      # createAuthenticatedMainnetAuthority + fenced Redis persistence) on real Redis with an IN-MEMORY TEST witness.
      - name: Mainnet authority integration (Codex HTTP authority, real Redis, test witness)
        run: TAPLY_REQUIRE_REDIS=1 node --test apps/web/scripts/mainnet-authority-integration.test.mts

      # Phase 6 real browser at the exact origin https://mainnet.taplyapp.xyz: challenge issued and validated, wallet
      # refused at the closed gate, fail-closed paths, no authority endpoint on the app server, no simulated authority.
      - name: Mainnet phase 6 browser checks (authenticated authority, isolated test configuration)
        working-directory: apps/web
        timeout-minutes: 10
        run: |
          set -a; . ./env/mainnet.env.example; set +a
          export VERCEL_ENV=preview NEXT_PUBLIC_TAPLY_SHARE_ORIGIN= NEXT_PUBLIC_TAPLY_CONTRACT_ID= NEXT_PUBLIC_TAPLY_PROTECTED_CONTRACT_ID= NEXT_PUBLIC_TAPLY_MAINNET_FIXTURES=on NEXT_PUBLIC_TAPLY_FLAG_HANDSHAKE=on
          export NEXT_PUBLIC_TAPLY_GIFT_CONTRACT_ID=gift.fixture.near NEXT_PUBLIC_TAPLY_GIFT_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf \
            NEXT_PUBLIC_TAPLY_GIFT_MIN_YOCTO=10000000000000000000000 NEXT_PUBLIC_TAPLY_GIFT_MAX_YOCTO=2000000000000000000000000 NEXT_PUBLIC_TAPLY_GIFT_FEE_YOCTO=10000000000000000000000 \
            NEXT_PUBLIC_TAPLY_MAINNET_ESCROW_CONTRACT_ID=payments.fixture.near NEXT_PUBLIC_TAPLY_MAINNET_ESCROW_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf \
            NEXT_PUBLIC_TAPLY_MAINNET_USDC_CODE_HASH=GMjfNNjfTPXSmeRaxgN1oS9srsmBSdS46R6y2kPv6JQf NEXT_PUBLIC_TAPLY_MAINNET_AUTHORITY=isolated-http
          KV_REST_API_URL=https://build-placeholder.invalid KV_REST_API_TOKEN=placeholder pnpm run build:mainnet
          if grep -rl 'taply.mainnet.sim-authority' .next/static; then
            echo "Simulated wallet authority found in the authenticated-authority bundle"; exit 1
          fi
          redis-server --port 6392 --save '' --appendonly no --daemonize yes
          TAPLY_ONECLICK_MODE=fixture pnpm exec next start -p 3122 --hostname 127.0.0.1 > "$RUNNER_TEMP/taply-browser-server-phase6.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; redis-cli -p 6392 shutdown nosave || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3122/m > /dev/null; then break; fi
            sleep 1
          done
          node scripts/mainnet-phase6-qa.mjs "$RUNNER_TEMP/taply-browser/node_modules/playwright/index.mjs" "$RUNNER_TEMP/taply-browser-evidence/phase6" http://127.0.0.1:3122 6392
          test "$(redis-cli -p 6392 -n 2 --scan | grep -vc '^taply:mainnet:authority:')" = "0"

      - name: Preserve Mainnet browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mainnet-browser-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/taply-browser-evidence
            ${{ runner.temp }}/taply-browser-server.log
            ${{ runner.temp }}/taply-browser-server-phase2.log
            ${{ runner.temp }}/taply-browser-server-phase5.log
            ${{ runner.temp }}/taply-browser-server-phase6.log
