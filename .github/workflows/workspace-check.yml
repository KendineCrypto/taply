# Taply TypeScript workspace gate: frozen lockfile install + root `pnpm check`
# (brand assets, build, typecheck, lint, tests for shared, near-client and web),
# followed by the standalone gated API and production Webpack build.
# No deployment, no wallet keys, no repository secrets, no network calls to NEAR.
name: workspace-check

on:
  workflow_dispatch:
  push:
    branches: [feature/frontend, feature/phase7-integration, main]
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - README.md
      - docs/**
      - .github/workflows/workspace-check.yml
  pull_request:
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - README.md
      - docs/**
      - .github/workflows/workspace-check.yml

permissions:
  contents: read

concurrency:
  group: workspace-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frozen install + pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24.22.2 (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm 11.5.0
        run: |
          npm install -g pnpm@11.5.0
          node -v; pnpm -v

      # Live Handshake (web) and the API store have tests against a REAL redis-server;
      # without it they are skipped. Installing it makes those 8 tests run here.
      - name: Install redis-server (for the real-Redis tests)
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          redis-server --version

      - name: Install (frozen lockfile, whole workspace)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        timeout-minutes: 15
        run: pnpm check

      - name: Standalone API strict types, lint and offline integration tests
        run: |
          node packages/shared/node_modules/typescript/bin/tsc -p apps/api/tsconfig.json
          node apps/web/node_modules/eslint/bin/eslint.js --config apps/api/eslint.config.mjs apps/api/src apps/api/test
          node --test apps/api/test/*.test.mts

      - name: Production Webpack build
        run: pnpm --filter @taply/web exec next build --webpack

      # NEAR mainnet candidate (docs/MAINNET_1CLICK_INTEGRATION.md §8). Preview
      # shape: no contract pinned, fixture screens, no signing, no funded quotes.
      # The guard must pass here and must refuse a build that inherits Testnet
      # values from the committed .env.production.
      - name: Mainnet build guard refuses inherited Testnet values
        working-directory: apps/web
        run: |
          if NEXT_PUBLIC_TAPLY_NETWORK=near-mainnet VERCEL_ENV=production node scripts/check-mainnet-env.mjs --require-mainnet; then
            echo "check-mainnet-env did not refuse a Testnet-valued mainnet build"; exit 1
          fi

      - name: Mainnet preview build (guarded) and static leak check
        working-directory: apps/web
        run: |
          set -a; . ./env/mainnet.env.example; set +a
          export VERCEL_ENV=preview NEXT_PUBLIC_TAPLY_SHARE_ORIGIN= NEXT_PUBLIC_TAPLY_CONTRACT_ID= NEXT_PUBLIC_TAPLY_PROTECTED_CONTRACT_ID= NEXT_PUBLIC_TAPLY_MAINNET_FIXTURES=on
          pnpm run build:mainnet
          if grep -rl -e 'taply-e2e-ce38a238' -e 'taply.testnet-vault.v1' .next/static; then
            echo "Testnet contract or vault key found in the mainnet bundle"; exit 1
          fi
