<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taply for X</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}
    *{box-sizing:border-box}
    body{width:320px;min-height:342px;background:#0b120e;color:#f4f6f0;margin:0;padding:22px}
    header{display:flex;align-items:center;justify-content:space-between}
    .brand{font-size:29px;font-weight:850;letter-spacing:-1px;color:#c7fc75}
    .tag{font-size:10px;letter-spacing:.1em;border:1px solid #416249;padding:6px 9px;border-radius:20px;color:#c7fc75}
    h1{font-size:22px;letter-spacing:-.5px;margin:25px 0 8px}
    p{font-size:12px;color:#a5b8aa;line-height:1.55;margin:0 0 20px}
    button{display:block;cursor:pointer;font:inherit;font-size:13px;font-weight:700;width:100%;padding:13px;margin:9px 0;border-radius:11px;background:#1b2e20;color:#f4f6f0;border:1px solid #34523d;text-align:left}
    button.primary{color:#101910;background:#c7fc75;border:0}
    button:focus-visible{outline:3px solid #c7fc75;outline-offset:2px}
    footer{font-size:10px;line-height:1.5;border-top:1px solid #284031;padding-top:15px;margin-top:19px;color:#8a9e91}
  </style>
</head>
<body>
  <header><span class="brand">taply.</span><span class="tag">TESTNET</span></header>
  <h1>Pay where you connect.</h1>
  <p>Tip a profile on X. Review and sign through Taply Wallet. Never trust an X handle alone as proof of wallet ownership.</p>
  <button class="primary" data-url="https://x.com">↗ Open X</button>
  <button data-url="https://taplyapp.xyz/wallet">Wallet & balance</button>
  <button data-url="https://taplyapp.xyz/request/new">Create payment request</button>
  <footer>Unofficial experimental extension. NEAR Testnet only. No private keys, account tokens, X API, or automated messages.</footer>
  <script src="popup.js"></script>
</body>
</html>
