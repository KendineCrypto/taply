[package]
name = "taply-payments-protected-sandbox"
version = "0.5.0"
edition = "2024"
publish = false

[dependencies]
near-workspaces = "=0.24.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
anyhow = "=1.0.100"
# Already in the lock via near-workspaces 0.24.0 (same versions and features); used
# only to wait for FINAL tx status so gas refunds settle before balance checks.
near-jsonrpc-client = { version = "=0.23.0", features = ["sandbox"] }
near-primitives = "=0.38.0"

[workspace]
