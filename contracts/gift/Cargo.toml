[package]
name = "taply-gift"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
borsh = "=1.5.7"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
ed25519-dalek = "=2.2.0"

[features]
# Deliberately broken payout callback ONLY for a separately built local sandbox
# artifact (proves "unknown outcome is never re-paid"). Never deploy it.
sandbox-fail-callback = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[workspace]
